server {
    listen 5173;
    listen [::]:5173;
    server_name _;

    root /app/dist;
    index index.html;

    # Acceso directo al puerto (sin Apache): misma app bajo el prefijo del build.
    location = / {
        return 301 /orcid2words/;
    }

    # Apache reenvía la URL completa (sin strip). Cubrimos `/orcid2words`,
    # `/orcid2words/` y `/orcid2words/...` con un solo bloque para no depender
    # de un `location = /orcid2words` exacto (que se ha visto caer en 404 según
    # cómo Apache forme la URI reenviada).
    location ~ ^/orcid2words(/.*)?$ {
        rewrite ^/orcid2words/?(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }
}
